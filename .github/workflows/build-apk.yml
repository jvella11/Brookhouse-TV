name: Build Brookhouse TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Brookhouse TV project
        run: unzip BrookhouseTV-Android-Project.zip -d extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd extracted/BrookhouseTV
          gradle assembleDebug

      - name: Rename APK
        run: |
          cp extracted/BrookhouseTV/app/build/outputs/apk/debug/app-debug.apk Brookhouse-TV.apk

      - name: Upload Brookhouse TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Brookhouse-TV
          path: Brookhouse-TV.apk
